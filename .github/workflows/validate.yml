name: Validate Python source
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - name: Check dependency consistency
        run: python -m pip check
      - name: Check Python compilation
        run: python -m compileall -q note_organizer
      - name: Check embedded reader runtime
        run: python tools/run_ui_tests.py tools/check_reader_environment.py
      - name: Run regression suite
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tmp/test-runtime | Out-Null
          $env:TEMP = (Resolve-Path tmp/test-runtime).Path
          $env:TMP = $env:TEMP
          python tools/run_ui_tests.py tools/run_test_batches.py
      - name: Keep regression diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-regression-diagnostics
          include-hidden-files: true
          path: |
            .test-tmp/ui-tests-*.log
            .test-tmp/suite-*/batch-*.log
          retention-days: 14
