name: Validate and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-build.lock
      - run: python -m pip install --require-hashes -r requirements-build.txt
      - run: python scripts/build_release.py
      - uses: actions/upload-artifact@v7
        with:
          name: Notable-Windows
          path: |
            dist/Notable-*.exe
            dist/Notable-*.manifest.json
